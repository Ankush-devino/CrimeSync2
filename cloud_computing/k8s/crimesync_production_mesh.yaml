# ==============================================================================
# 🛡️ CrimeSync Sovereign Kubernetes Mesh & Auto-Scaling Specification
# Production K8s Manifest for Indian Law Enforcement Cloud Infrastructure
# ==============================================================================

apiVersion: v1
kind: Namespace
metadata:
  name: crimesync-prod
  labels:
    istio-injection: enabled
    security.policy: sovereign-zero-trust
---
# ------------------------------------------------------------------------------
# 1. 🚀 CRIMESYNC API GATEWAY (CORE EXPRESS MICROSERVICE)
# ------------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crimesync-api-gateway
  namespace: crimesync-prod
  labels:
    app: crimesync-api
    tier: gateway
spec:
  replicas: 4
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: crimesync-api
  template:
    metadata:
      labels:
        app: crimesync-api
    spec:
      containers:
        - name: express-api
          image: registry.police.gov.in/crimesync/api-gateway:v2.5.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              name: http
          envFrom:
            - secretRef:
                name: crimesync-vault-secrets
            - configMapRef:
                name: crimesync-cloud-config
          resources:
            requests:
              cpu: "1000m"
              memory: "2Gi"
            limits:
              cpu: "4000m"
              memory: "8Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
---
# ------------------------------------------------------------------------------
# 2. 🤖 AI AGENT & GPU INFERENCE POD (LANGGRAPH & PYTORCH GNN)
# ------------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crimesync-ai-agent-swarm
  namespace: crimesync-prod
  labels:
    app: crimesync-ai-agent
    tier: ml-inference
spec:
  replicas: 2
  selector:
    matchLabels:
      app: crimesync-ai-agent
  template:
    metadata:
      labels:
        app: crimesync-ai-agent
    spec:
      nodeSelector:
        accelerator: nvidia-gpu
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: langgraph-agent-engine
          image: registry.police.gov.in/crimesync/ai-agent-engine:v2.4.0
          ports:
            - containerPort: 8000
              name: ai-http
          resources:
            requests:
              cpu: "2000m"
              memory: "8Gi"
              nvidia.com/gpu: 1
            limits:
              cpu: "8000m"
              memory: "32Gi"
              nvidia.com/gpu: 1
---
# ------------------------------------------------------------------------------
# 3. 📈 HORIZONTAL POD AUTOSCALER (HPA)
# ------------------------------------------------------------------------------
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: crimesync-api-hpa
  namespace: crimesync-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: crimesync-api-gateway
  minReplicas: 4
  maxReplicas: 24
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
# ------------------------------------------------------------------------------
# 4. 🌐 CLOUD SERVICE & INGRESS WITH TLS 1.3
# ------------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: crimesync-api-service
  namespace: crimesync-prod
spec:
  type: ClusterIP
  selector:
    app: crimesync-api
  ports:
    - port: 5000
      targetPort: 5000
      protocol: TCP
      name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: crimesync-sovereign-ingress
  namespace: crimesync-prod
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/proxy-body-size: "500m"
    cert-manager.io/cluster-issuer: "letsencrypt-police-ca"
spec:
  tls:
    - hosts:
        - portal.crimesync.police.gov.in
      secretName: crimesync-tls-cert
  rules:
    - host: portal.crimesync.police.gov.in
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: crimesync-api-service
                port:
                  number: 5000
